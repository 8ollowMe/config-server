server:
  port: 13100

spring:
  application:
    name: config-server
  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: https://github.com/8ollowMe/project-configs
          default-label: dev
          search-paths:
            - configs/common
            - configs/{application}/{profile}
            - configs/{application}
          basedir: configs
          clone-on-start: true

eureka:
  instance:
    prefer-ip-address: false
    # ${환경변수이름:미설정 default값}
    hostname: ${HOSTNAME:localhost}

  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      # ${환경변수이름:미설정 default값}
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:13101/eureka/}

# 설정값 refresh, 헬스체크, 매트릭 수집 엔드포인트
management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info,metrics
